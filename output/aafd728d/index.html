<!--
  NOTE: This is a simplified HyperFrames composition. The exact data-attribute
  names and animation syntax should be checked against the real docs at
  https://hyperframes.heygen.com before you rely on this rendering correctly -
  I'm showing the wiring (how a plan becomes a composition file), not
  guaranteeing this matches HyperFrames' current authoring API exactly.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      background: #1A0B2E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
    }
    h1 { font-size: 96px; margin: 0; }
    p  { font-size: 42px; opacity: 0.8; margin-top: 20px; }
  </style>
</head>
<body>
  <div
    data-hf-composition
    data-hf-duration="6"
    data-hf-animation="zoom"
  >
    <h1>Celebrating 10,000 Users</h1>
    <p>Thank you for being part of our journey.</p>
  </div>
</body>
</html>
