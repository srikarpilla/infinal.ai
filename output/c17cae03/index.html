<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>AI Transformers Architecture</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0F172A;
        font-family: "Inter", sans-serif;
      }
      #text-block {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
      }
      h1 { font-size: 96px; margin: 0; }
      p  { font-size: 42px; opacity: 0.8; margin-top: 20px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=block" rel="stylesheet">
  </head>
  <body>
    <div
      data-hf-id="hf-root"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="text-block">
        <h1 id="title-text">AI Transformers Architecture</h1>
        <p id="subtitle-text">Understanding the neural networks behind modern AI.</p>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      // Animation style chosen by the LLM plan: fade, slide, or zoom.
      
      tl.from("#text-block", { scale: 0.5, opacity: 0, duration: 1, ease: "back.out(1.7)" });
      
    </script>
  </body>
</html>
